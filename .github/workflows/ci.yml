name: 持续集成

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端构建与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 当前文档校验
        shell: pwsh
        run: ./scripts/check-current-docs.ps1 -Root .

      - name: 字典本地化校验
        shell: pwsh
        run: ./scripts/validate-dic-localization.ps1 -Root .

      - name: 恢复依赖
        run: dotnet restore ICP-Platform.sln

      - name: 构建
        run: dotnet build ICP-Platform.sln --no-restore --configuration Release

      - name: 模型 DTO 同步校验
        run: dotnet run --project server/tools/model-dto-sync/ModelDtoSync.csproj --configuration Release --no-build --no-restore -- --check .

      - name: 运行测试
        run: dotnet test ICP-Platform.sln --no-build --no-restore --configuration Release --verbosity normal

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js 与 pnpm
        uses: pnpm/setup@v2
        with:
          package-json-file: frontend/package.json
          install: false

      - name: 安装依赖
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: 运行测试
        working-directory: frontend
        run: pnpm test

      - name: 构建
        working-directory: frontend
        run: pnpm build
