<script>
/* PROTOTYPE: 只演示已确认裁决，不连接服务端，不替代数据库比较语义。 */
const Policy = (function () {
  const parents={sales:null,sales1:'sales',finance:null};
  function member(g,u) {
    if(g.type==='everyone')return true;
    if(g.type==='user')return g.subject===u.id;
    if(g.type==='role')return u.roles.includes(g.subject);
    if(g.type==='company')return g.subject===u.company;
    if(g.type==='project')return u.projects.includes(g.subject);
    if(g.type==='org'){
      let current=u.org;
      while(current){if(current===g.subject)return true;if(!g.descendants)break;current=parents[current];}
    }
    return false;
  }
  function subjectDecision(grants,u,action){
    const matching=grants.filter(g=>member(g,u)&&g.actions[action]&&g.actions[action]!=='none');
    if(!matching.length)return {value:'none',names:[],priority:null};
    const priority=Math.max(...matching.map(g=>Number(g.priority)));
    const top=matching.filter(g=>Number(g.priority)===priority);
    return {value:top.some(g=>g.actions[action]==='deny')?'deny':'allow',priority,names:top.map(g=>g.label||g.subject||'所有用户')};
  }
  function valueOf(c,u){
    const context={'@user.id':u.id,'@user.person':u.person,'@user.company':u.company,'@user.org':u.org};
    return typeof c.value==='string'&&Object.hasOwn(context,c.value)?context[c.value]:c.value;
  }
  function condition(c,o,u,action){
    if(c.kind==='all')return !c.model||c.model===o.model;
    if(c.kind==='group'){
      if(!c.children.length)return null;
      const parts=c.children.map(x=>condition(x,o,u,action)).filter(x=>x!==null);
      if(!parts.length)return null;
      return c.mode==='or'?parts.some(Boolean):parts.every(Boolean);
    }
    if(c.kind==='business'){
      const definition=businessTypes[c.business];
      if(!definition)throw new Error('业务条件未登记');
      if(action==='read'&&!definition.read)return null;
      if(c.business==='error')throw new Error('业务条件暂时无法完成判断');
      if(c.business==='workflow'||c.business==='workflow-readable')return o.workflow;
      if(c.business==='project')return u.projects.includes(o.project);
      return false;
    }
    if(c.model!==o.model)return false;
    const a=o[c.field],b=valueOf(c,u);
    if(c.op==='empty')return a==null;
    if(c.op==='notempty')return a!=null;
    if(a==null||b==null)return false;
    switch(c.op){
      case'eq':return String(a)===String(b);
      case'ne':return String(a)!==String(b);
      case'gt':return a>b;
      case'gte':return a>=b;
      case'lt':return a<b;
      case'lte':return a<=b;
      case'contains':return String(a).includes(String(b));
      case'starts':return String(a).startsWith(String(b));
      case'ends':return String(a).endsWith(String(b));
      case'in':return (Array.isArray(b)?b:String(b).split(',')).some(x=>String(x)===String(a));
      case'notin':return !(Array.isArray(b)?b:String(b).split(',')).some(x=>String(x)===String(a));
      default:throw new Error('比较方式未登记');
    }
  }
  function evaluate(rules,objectGrants,u,o,actions){
    const raw={};
    for(const action of actions){
      if(u.localAdmin||action.enabled===false){
        const source=u.localAdmin?'LocalAdmin · 数据范围豁免':'动作未参与数据范围判定';
        raw[action.id]={value:'allow',source,rule:'none',object:'none',log:[source+'；功能资格和业务约束仍须满足。']};
        continue;
      }
      const log=[];
      try{
        function relevant(rule){
          return rule.enabled&&(rule.grants.some(g=>member(g,u)&&g.actions[action.id]&&g.actions[action.id]!=='none')||rule.children.some(relevant));
        }
        function visit(rule){
          if(!rule.enabled){log.push(rule.name+'：已停用，整个子树不参与');return [];}
          if(!relevant(rule)){log.push(rule.name+'：当前主体在此子树中未设置该动作');return [];}
          const match=condition(rule.condition,o,u,action.id);
          if(match===false){log.push(rule.name+'：条件未命中');return [];}
          const own=match===null?{value:'none',names:[],priority:null}:subjectDecision(rule.grants,u,action.id);
          log.push(rule.name+'：'+(match===null?'没有读取贡献':own.value==='none'?'命中，未表态':(own.value==='allow'?'同意':'拒绝')+'，优先级 '+own.priority+'（'+own.names.join('、')+'）'));
          const child=rule.children.flatMap(visit);
          if(child.length)return child;
          return own.value==='none'?[]:[{value:own.value,source:rule.name}];
        }
        const votes=rules.flatMap(visit),denies=votes.filter(v=>v.value==='deny');
        const ruleValue=denies.length?'deny':votes.length?'allow':'none';
        const direct=subjectDecision(objectGrants[o.id]||[],u,action.id);
        const value=direct.value!=='none'?direct.value:ruleValue!=='none'?ruleValue:'allow';
        const source=direct.value!=='none'?'对象授权 · 优先级 '+direct.priority:ruleValue!=='none'?'规则授权 · '+(denies.length?denies:votes).map(v=>v.source).join('、'):'默认允许';
        raw[action.id]={value,source,rule:ruleValue,object:direct.value,log};
      }catch(e){raw[action.id]={value:'error',source:'授权判断异常',rule:'error',object:'none',log:log.concat(e.message)};}
    }
    const output=JSON.parse(JSON.stringify(raw));
    for(const action of actions){
      if(!u.localAdmin&&action.requiresRead&&raw[action.id].value==='allow'&&raw.read.value!=='allow'){
        output[action.id].value=raw.read.value==='error'?'error':'deny';
        output[action.id].source=raw.read.value==='error'?'读取判断异常':'读取权限不允许';
        output[action.id].log.push('动作自身允许，仍须满足独立的读取依赖。');
      }
    }
    return {actions:output,raw};
  }
  return {member,evaluate};
})();

</script>
<script>
const clone=x=>JSON.parse(JSON.stringify(x));
const E=x=>String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/'/g,'&#39;');
let serial=20;
const uid=p=>p+(++serial);
const actionsSeed=[
  {id:'read',name:'读取',enabled:true,requiresRead:false},
  {id:'create',name:'新建',enabled:true,requiresRead:false},
  {id:'edit',name:'编辑',enabled:true,requiresRead:true},
  {id:'delete',name:'删除',enabled:true,requiresRead:true},
  {id:'grant',name:'授权',enabled:true,requiresRead:true}

function validateTree(root){

      c.children.forEach(x=>checkCondition(x,nodeId));return;
    }
    if(c.kind==='all')return;
    if(c.kind==='business'){if(!businessTypes[c.business])invalid('请选择已登记的业务条件。');return;}
    const info=fieldInfo(c);
    if(!info){invalid('请选择有效 Model 和属性。');return;}
    if(!availableOperators(c).some(([id])=>id===c.op))invalid('比较方式与属性类型不相容。');
    if(['empty','notempty'].includes(c.op))return;
    if(typeof c.value==='string'&&c.value.startsWith('@')){
      if(!contexts.some(([id,,type])=>id===c.value&&type===info.type))invalid('上下文值与属性类型不相容。');return;
    }

    for(const value of values){

      else if(['enum','user','person','company','department'].includes(info.type)&&!choicesFor(c).some(([id])=>id===value))invalid('比较值不在此属性的候选目录中。');
    }

}
function stateHTML(rules,depth=0){
  return rules.map(r=>'<div class="state-item" style="padding-left:'+(depth*16)+'px"><strong>'+E(r.name)+'</strong> '+tag(r.enabled?'启用':'停用',r.enabled?'green':'')+'<div class="tiny muted">'+E(describeCondition(r.condition))+'</div><div class="tiny muted">'+r.grants.map(g=>E(g.label)+'（优先级 '+g.priority+'）：'+saved.actions.filter(a=>g.actions[a.id]&&g.actions[a.id]!=='none').map(a=>E(a.name)+' '+statusText(g.actions[a.id])).join('、')).join('；')+'</div></div>'+stateHTML(r.children,depth+1)).join('');
}
function render(){
  const titles={rules:['规则授权','按一棵根规则树编辑、检查并保存。'],objects:['对象授权','在具体对象上维护整份授权，明确结果优先于规则。'],actions:['动作目录','查看独立动作、数据范围启用状态与读取依赖。'],tour:['裁决场景','使用示例检查已确认的裁决边界。']};
  const previewButton=['rules','objects'].includes(page)?button(previewOpen?'收起结果预览':'展开结果预览','togglePreview()'):'';
  const treePanel='<aside class="panel tree-panel"><div class="panel-head"><div class="flex between"><h3>规则树</h3>'+tag(draft.rules.length+' 棵根树')+'</div><div class="flex tree-tools">'+button('＋ 根规则','addRule(false)','small')+button('＋ 子规则','addRule(true)','small',!selected||!!pendingRootDeletion)+'</div></div><div id="tree-content" class="tree" role="tree" aria-label="规则树">'+renderTree(draft.rules)+'</div><div class="hint-row">同树节点共享一份草稿；跨根切换时处理未保存修改。</div></aside>';
  const content=page==='rules'?'<div class="workspace '+(!previewOpen?'preview-collapsed':'')+'">'+treePanel+ruleEditor()+previewHTML()+'</div>':page==='objects'?objectPage():page==='actions'?catalogPage():tourPage();
  document.getElementById('app').innerHTML='<div class="app"><nav class="nav"><div class="brand">NewP<small>AUTHORIZATION LAB</small></div>'+[['rules','◇　规则授权'],['objects','▦　对象授权'],['actions','≡　动作目录'],['tour','▷　裁决场景']].map(([id,label])=>button(label,call('nav',id),page===id?'active':'')).join('')+'<div class="bottom">交互原型 · 非生产<br>示例数据，刷新即重置<br><a href="https://github.com/yangfengfan2011/NewP/issues/227" target="_blank" rel="noopener" style="color:#bfd4f8">查看当前规格 ↗</a></div></nav><main class="main"><header class="top flex between"><div><div class="flex"><h1>'+titles[page][0]+'</h1>'+tag('交互原型','blue')+'</div><p class="subtitle">'+titles[page][1]+'</p></div><div class="flex wrap">'+previewButton+button('重置示例','resetAll()')+'</div></header><div class="intro"><strong>本原型验证：</strong>根规则树草稿与保存、类型化条件、主体授权和动作状态是否易于理解。仅使用内存示例，不连接后端或写入真实配置。</div>'+content+'<div id="last-change" class="footer-note">最近操作：'+E(lastChange)+' · '+(dirty?'当前根规则树有未保存修改。':'示例仅保留在本次页面会话。')+'</div>'+ruleSaveBar()+'</main></div>';
  if(modal)renderModal();if(guard)renderGuard();
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(guard)resolveGuard('cancel');else if(modal)closeModal();}});
window.addEventListener('beforeunload',e=>{if(dirty||modal?.dirty){e.preventDefault();e.returnValue='';}});

const tours={
tree:{name:'父子与分支',intro:'看“不选”的子分支是否会把父级拒绝重新带回来。',steps:[
 ['载入父子场景','父拒绝编辑，本人负责的子规则同意，另一子规则不选。预期：编辑同意。',()=>{saved=seed();saved.objectGrants={};}],
 ['让另一子分支明确拒绝','两个子分支都命中，一同意一拒绝。预期：编辑拒绝。',()=>{saved.rules[0].children[1].grants[0].actions.edit='deny';}],
 ['停用拒绝的子分支','保留配置但退出裁决。预期：编辑重新同意。',()=>{saved.rules[0].children[1].enabled=false;}],
 ['停用整个父规则','子规则也不参与。当前对象没有其他编辑限制，预期：默认允许。',()=>{saved.rules[0].enabled=false;}]
 ]},
priority:{name:'主体优先级',intro:'“所有用户拒绝，部门 A 同意”不靠主体类型特判，使用显式优先级。',steps:[
 ['载入主体场景','所有用户优先级 0 拒绝读取，销售部优先级 10 同意。预期：张三读取同意。',()=>{saved=seed();saved.rules=[{id:'p1',name:'主体优先级示例',enabled:true,condition:group([{id:uid('c'),kind:'all',model:''}]),children:[],grants:[grant('everyone','',0,{read:'deny'}),grant('org','sales',10,{read:'allow'})]}];saved.objectGrants={};}],
 ['把部门优先级改成 0','最高优先级相同，同意与拒绝冲突。预期：读取拒绝，编辑也受读取限制。',()=>{saved.rules[0].grants[1].priority=0;}],
 ['让高优先级主体不选','部门优先级 10，但读取不选。仍采用公共拒绝。',()=>{saved.rules[0].grants[1].priority=10;saved.rules[0].grants[1].actions.read='none';}],
 ['恢复部门同意，并包含下级','模拟销售一组的王敏；部门包含下级后命中。预期：读取同意。',()=>{saved.rules[0].grants[1].actions.read='allow';saved.rules[0].grants[1].descendants=true;userId='u3';}]
 ]},
object:{name:'对象覆盖规则',intro:'同一个动作，对象的明确授权优先；撤销对象设置后重新使用规则。',steps:[
 ['载入规则拒绝','该订单编辑被规则拒绝，读取默认允许。',()=>{saved=seed();saved.rules[0].children=[];saved.objectGrants={};}],
 ['显式添加对象同意','为订单 001 给张三配置编辑同意。预期：对象授权覆盖规则拒绝。',()=>{saved.objectGrants[objects[0].id]=[grant('user','u1',10,{edit:'allow'})];}],
 ['改为对象拒绝','预期：编辑拒绝。对象授权两种明确意见都具有优先性。',()=>{saved.objectGrants[objects[0].id][0].actions.edit='deny';}],
 ['撤销对象授权项','预期：重新沿用规则拒绝，不自动补授其他动作。',()=>{delete saved.objectGrants[objects[0].id];}]
 ]},
read:{name:'读取的特殊性',intro:'未提供读取条件与条件执行失败不同；允许编辑也不能补授读取。',steps:[
 ['载入可选读取条件','仅业务条件“流程中”，未提供读取部分，配置读取拒绝。预期：规则不参与读取，默认允许。',()=>{saved=seed();saved.rules=[{id:'b1',name:'流程业务条件',enabled:true,condition:group([{id:uid('c'),kind:'business',business:'workflow',read:false}]),grants:[grant('everyone','',0,{read:'deny',edit:'deny'})],children:[]}];saved.objectGrants={};objectId=objects[3].id;}],
 ['使用提供读取能力的条件','换为已登记的“流程中（含读取）”条件，合同正在流程中。预期：读取拒绝，编辑/删除/授权均不能执行。',()=>{saved.rules[0].condition.children[0].business='workflow-readable';}],
 ['只给对象编辑同意','预期：编辑自身同意，但最终仍因读取被拒绝而不可编辑。',()=>{saved.objectGrants[objects[3].id]=[grant('user','u1',10,{edit:'allow'})];}],
 ['再明确给予对象读取同意','预期：读取与编辑允许；对象授权覆盖读取规则。',()=>{saved.objectGrants[objects[3].id][0].actions.read='allow';}],
 ['模拟条件执行失败','预期：报告异常，不把故障当作没有配置。',()=>{saved.rules[0].condition.children[0].business='error';saved.objectGrants={};}]
 ]}
};

tours.actions={name:'动作开关与豁免',intro:'动作自身与读取依赖独立组合；以下开关仅模拟目录生效后的状态。',steps:[
  ['载入读取和编辑拒绝','两个动作均启用且明确拒绝，预期均不可执行。',()=>{saved=seed();saved.rules=[{id:'switch-root',name:'动作开关示例',enabled:true,condition:group([{id:uid('c'),kind:'all',model:''}]),grants:[grant('everyone','',0,{read:'deny',edit:'deny'})],children:[]}];saved.objectGrants={};}],
  ['仅停用编辑判定','编辑自身不再判定，但读取仍拒绝，因此仍不能编辑。',()=>{saved.actions.find(a=>a.id==='edit').enabled=false;}],
  ['停用读取判定','读取不再限制；编辑自身也已停用，预期两者均允许。',()=>{saved.actions.find(a=>a.id==='read').enabled=false;}],
  ['重新启用编辑','保留的编辑拒绝重新参与，读取仍不限制，编辑再次拒绝。',()=>{saved.actions.find(a=>a.id==='edit').enabled=true;}],
  ['切换为 LocalAdmin','LocalAdmin 跳过数据范围层。功能资格和业务约束仍须满足。',()=>{userId='admin';}]
]};
function chooseTour(id){tourId=id;tourStep=-1;render();}
function runStep(index){
  leaveRuleDraft(()=>{
    userId='u1';objectId=objects[0].id;
    for(let i=0;i<=index;i++)tours[tourId].steps[i][2]();
    draft=clone(saved);selected=draft.rules[0]?.id||'';dirty=false;dirtyRootId=null;pendingRootDeletion=null;
    validationErrors=[];tourStep=index;lastChange='场景操作：'+tours[tourId].steps[index][0];render();
  });
}

function tourPage(){
 const t=tours[tourId];
 return '<div class="object-layout"><div><div class="tour-tabs">'+Object.entries(tours).map(([id,t])=>button(t.name,"chooseTour('"+id+"')",tourId===id?'active':'')).join('')+'</div><div class="panel panel-body" style="margin-bottom:14px"><h2>'+t.name+'</h2><p class="subtitle">'+t.intro+'</p><p class="note">每个步骤都是实际状态变更。切换场景后点击第一步会载入独立示例；可随时去规则页面自由修改。</p></div><div class="tour-steps">'+t.steps.map((s,i)=>'<div class="tour-step '+(i<=tourStep?'done':'')+'"><span class="number">'+(i+1)+'</span><div class="grow"><h3>'+s[0]+'</h3><p>'+s[1]+'</p></div>'+button(i===tourStep?'已执行 · 再运行':'执行这一步','runStep('+i+')',i===tourStep?'':'primary')+'</div>').join('')+'</div><div class="panel" style="margin-top:18px"><div class="panel-head"><h3>当前示例配置</h3></div><div class="panel-body raw-state">'+stateHTML(saved.rules)+'</div></div></div>'+previewHTML(true)+'</div>';
}

render();
</script>
</body>
</html>
