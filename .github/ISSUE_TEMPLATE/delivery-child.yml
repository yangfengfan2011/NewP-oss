name: 交付 Child
description: 实现、验收资产或原子切换任务
title: "[Delivery] "
labels:
  - wayfinder:task
body:
  - type: input
    id: parent
    attributes:
      label: Parent
      placeholder: "#71"
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Delivery role
      options:
        - implementation
        - acceptance-asset
        - atomic-cutover
    validations:
      required: true
  - type: textarea
    id: build
    attributes:
      label: What to build
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Boundaries
      description: 写明 Owns 与 Does not own。
    validations:
      required: true
  - type: textarea
    id: capability_fit
    attributes:
      label: Capability fit
      description: 按行为区分平台已有、模块 adapter 和新公共 seam；任何公共契约、SDK seam、Host/Shell 入口或模块边界变化都要填写设计依据。
      placeholder: |
        | 行为 | 平台已有 | 模块 adapter | 新公共 seam / 设计依据 |
        |---|---|---|---|
        | ... | ... | ... | ... |
    validations:
      required: true
  - type: textarea
    id: seams
    attributes:
      label: Test seams and browser surfaces
      description: 填写正式 API、metadata/capability、database/log、开发浏览器 harness 和 Acceptance runner 的 owner、恢复 checkpoint 与 handoff；开发默认复用 Development 数据库并填写唯一数据前缀，仅在测试对象要求隔离 catalog 时写明例外原因。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance ownership
      description: 每项行为选择最小充分证明层级（含 browser-smoke 或 browser-gate），并填写 owner、runner/journey、命令、成功信号和首次可运行的 Issue。
      placeholder: |
        | 行为 | 证明层级 | 执行 owner | Runner/Journey | 命令 | 成功信号 | 首次可运行于 |
        |---|---|---|---|---|---|---|
        | ... | API/integration | ... | ... | ... | ... | 本 Issue |
    validations:
      required: true
  - type: textarea
    id: red_green
    attributes:
      label: Planned RED and targeted verification
      description: 规划稳定 RED、GREEN 命令及本 Issue 首次可运行的最窄 Gate slice；实际结果在关闭评论回写。
    validations:
      required: true
  - type: input
    id: dependencies
    attributes:
      label: Native dependencies
      description: 创建时用 --parent 和 --blocked-by 建立原生关系；这里只记录计划核对值。
      placeholder: "Parent #71；Blocked by None 或 #72"
    validations:
      required: true
  - type: textarea
    id: closeout_plan
    attributes:
      label: Closeout plan
      description: 规划范围提交、runner 实际运行、证据回写、回滚和 cleanup；创建 Issue 不表示这些事项已经完成。
      placeholder: |
        - 首次可运行的 runner/journey：...
        - 计划提交边界：...
        - 关闭评论与 cleanup：...
    validations:
      required: true
